<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>신홍탄 메일 서명</title>
<meta name="robots" content="noindex">
<style>
 :root{--ink:#1d2127;--muted:#6b7280;--line:#e5e7eb;--seal:#941810;--bg:#f4f5f7;--card:#fff}
 *{box-sizing:border-box}
 body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 -apple-system,BlinkMacSystemFont,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;padding:32px max(16px,env(safe-area-inset-left,0px)) 48px max(16px,env(safe-area-inset-right,0px))}
 main{max-width:680px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
 h1{margin:0;font-size:20px}
 .lead{margin:4px 0 0;color:var(--muted)}
 .card{background:var(--card);border-radius:14px;padding:20px;box-shadow:0 1px 2px #0000000d,0 4px 16px #0000000a}
 .fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
 label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--muted)}
 input{height:38px;padding:0 10px;border:1px solid var(--line);border-radius:8px;font:inherit;font-size:14px;color:var(--ink)}
 input:focus{outline:none;border-color:var(--seal)}
 .tabs{display:flex;gap:6px;margin-bottom:14px}
 .tabs button{height:32px;padding:0 12px;border:1px solid var(--line);border-radius:999px;background:#fff;font:inherit;font-size:13px;cursor:pointer}
 .tabs button[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:#fff}
 .preview{padding:20px;border:1px dashed var(--line);border-radius:10px;overflow-x:auto}
 .actions{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap}
 .copy{height:40px;padding:0 18px;border:0;border-radius:8px;background:var(--seal);color:#fff;font:inherit;font-weight:600;cursor:pointer}
 .status{font-size:13px;color:var(--muted)}
 ol{margin:0;padding-left:20px;color:#374151}ol li{margin:4px 0}
 @media(max-width:560px){.fields{grid-template-columns:1fr}}
</style>
</head>
<body>
<main>
 <header><h1>신홍탄 메일 서명</h1><p class="lead">이름·역할·연락처를 넣고 '서명 복사'를 누른 뒤 Gmail 서명 칸에 붙여 넣으세요.</p></header>
 <section class="card">
  <div class="fields">
   <label>이름<input id="f-name" value="" placeholder="홍길동" autocomplete="name"></label>
   <label>역할<input id="f-role" value="" placeholder="대표 · 서비스 기획"></label>
   <label>연락처 (선택)<input id="f-phone" value="" placeholder="010-0000-0000" autocomplete="tel"></label>
  </div>
 </section>
 <section class="card">
  <div class="tabs" role="group" aria-label="서명 종류"><button type="button" data-kind="full" aria-pressed="true">기본형</button><button type="button" data-kind="short" aria-pressed="false">짧은 형 (답장용)</button></div>
  <div class="preview" id="preview"></div>
  <div class="actions"><button type="button" class="copy" id="copy">서명 복사</button><span class="status" id="status" role="status"></span></div>
 </section>
 <section class="card">
  <ol>
   <li>Gmail → 설정(톱니바퀴) → 모든 설정 보기 → 기본설정 → <b>서명</b> → 새로 만들기</li>
   <li>서명 칸을 클릭하고 <b>⌘V</b>(윈도우 Ctrl+V)로 붙여 넣기 — 로고와 링크가 그대로 들어가요</li>
   <li>아래 '서명 기본값'에서 새 이메일은 기본형, 답장/전달은 짧은 형을 고른 뒤 맨 아래 <b>변경사항 저장</b></li>
  </ol>
 </section>
</main>
<script>
const SITE='https://bangguseok-semiconductor.github.io/bangguseok-semiconductor/';
const LOGO=SITE+'brand/shinhongtan-seal.png';
const MAIL='sinhongtann@gmail.com';
let kind='full';
const esc=s=>s.replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const val=id=>document.getElementById(id).value.trim();
function sig(){
 const name=esc(val('f-name')||'이름'),role=esc(val('f-role')),phone=esc(val('f-phone'));
 const F="font-family:Arial,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;";
 if(kind==='short')return `<table cellpadding="0" cellspacing="0" border="0" style="${F}font-size:12px;line-height:1.5;color:#1d2127"><tr><td style="padding-right:10px;vertical-align:middle"><img src="${LOGO}" width="22" height="36" alt="신홍탄" style="display:block;border:0"></td><td style="vertical-align:middle"><b>${name}</b> <span style="color:#9ca3af">|</span> 신홍탄 · 방구석 반도체<br><a href="mailto:${MAIL}" style="color:#6b7280;text-decoration:none">${MAIL}</a> <span style="color:#9ca3af">·</span> <a href="${SITE}" style="color:#941810;text-decoration:none">방구석 반도체 체험하기</a></td></tr></table>`;
 return `<table cellpadding="0" cellspacing="0" border="0" style="${F}font-size:13px;line-height:1.55;color:#1d2127"><tr>
<td style="padding-right:16px;vertical-align:top"><img src="${LOGO}" width="49" height="80" alt="신홍탄" style="display:block;border:0"></td>
<td style="border-left:2px solid #941810;padding-left:16px;vertical-align:top">
<div style="font-size:15px;font-weight:bold;color:#1d2127">${name}${role?` <span style="font-size:12px;font-weight:normal;color:#6b7280">${role}</span>`:''}</div>
<div style="font-size:13px;color:#941810;font-weight:bold;margin-top:2px">신홍탄 · 방구석 반도체 <span style="font-weight:normal;color:#9ca3af;font-size:11px;letter-spacing:.5px">THE FIRST FAB</span></div>
<div style="font-size:12px;color:#6b7280;margin-top:6px">클린룸·공정·장비를 웹에서 3D로 둘러보는 반도체 입문 학습</div>
<div style="font-size:12px;margin-top:8px"><a href="${SITE}" style="color:#941810;text-decoration:none;font-weight:bold">체험하기 →</a>&nbsp;&nbsp;<span style="color:#d1d5db">|</span>&nbsp;&nbsp;<a href="mailto:${MAIL}" style="color:#1d2127;text-decoration:none">${MAIL}</a>${phone?`&nbsp;&nbsp;<span style="color:#d1d5db">|</span>&nbsp;&nbsp;<span style="color:#1d2127">${phone}</span>`:''}</div>
</td></tr></table>`;
}
function render(){document.getElementById('preview').innerHTML=sig();document.getElementById('status').textContent=''}
['f-name','f-role','f-phone'].forEach(id=>document.getElementById(id).addEventListener('input',render));
document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>{kind=b.dataset.kind;document.querySelectorAll('.tabs button').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render()}));
document.getElementById('copy').addEventListener('click',async()=>{
 const st=document.getElementById('status'),html=sig(),node=document.getElementById('preview');
 try{await navigator.clipboard.write([new ClipboardItem({'text/html':new Blob([html],{type:'text/html'}),'text/plain':new Blob([node.innerText],{type:'text/plain'})})]);st.textContent='복사했어요. Gmail 서명 칸에 붙여 넣으세요.'}
 catch{const r=document.createRange();r.selectNodeContents(node);const s=getSelection();s.removeAllRanges();s.addRange(r);st.textContent='서명을 선택해 뒀어요. ⌘C(윈도우 Ctrl+C)로 복사해 주세요.'}
});
render();
</script>
</body>
</html>
