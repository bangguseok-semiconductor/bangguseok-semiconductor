<!doctype html><html lang="ko"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><meta name="theme-color" content="#142e38"/><link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin/><link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css"/><title>방구석 반도체 · 가상 실습실</title><style id="boot-skeleton-css">
/* 첫 로딩 스켈레톤: 앱 코드가 오기 전에 화면 뼈대를 먼저 보여줘요. React가 그리면 #root 안 내용이 바뀌며 사라져요. */
#boot-skeleton{position:fixed;inset:0;display:grid;place-items:center;background:#24282e;font-family:Pretendard,system-ui,sans-serif}
#boot-skeleton .sk{background:linear-gradient(90deg,#ffffff10 25%,#ffffff22 37%,#ffffff10 63%);background-size:400% 100%;animation:sk 1.4s ease infinite;border-radius:10px}
#boot-skeleton .sk-top{position:absolute;top:22px;right:24px;display:flex;gap:10px}
#boot-skeleton .sk-card{display:flex;gap:28px;width:min(640px,calc(100vw - 48px));padding:28px;border-radius:20px;background:#ffffff0a;box-shadow:inset 0 0 0 1px #ffffff14;box-sizing:border-box}
#boot-skeleton .sk-col{display:flex;flex:1;flex-direction:column;gap:12px;justify-content:center}
#boot-skeleton p{position:absolute;bottom:28px;left:0;right:0;margin:0;text-align:center;color:#ffffff73;font-size:12px;letter-spacing:.02em}
@media (max-width:640px){#boot-skeleton .sk-art{display:none}}
@media (prefers-reduced-motion:reduce){#boot-skeleton .sk{animation:none}}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}
</style></head><body><div id="root"><div id="boot-skeleton" role="status" aria-live="polite"><div class="sk-top"><div class="sk" style="width:120px;height:36px;border-radius:18px"></div><div class="sk" style="width:36px;height:36px"></div></div><div class="sk-card"><div class="sk sk-art" style="width:200px;height:300px;border-radius:14px"></div><div class="sk-col"><div class="sk" style="width:46%;height:12px"></div><div class="sk" style="width:82%;height:26px"></div><div class="sk" style="width:64%;height:26px"></div><div style="height:12px"></div><div class="sk" style="width:100%;height:42px"></div><div class="sk" style="width:100%;height:42px"></div><div class="sk" style="width:38%;height:44px;align-self:flex-end;border-radius:12px"></div></div></div><p>가상 실습실을 준비하고 있어요</p></div></div><script type="module" src="/src/main.tsx"></script></body></html>
